<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48d8d8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#topBorder)"/>
  <defs>
    <linearGradient id="topBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="30%" stop-color="#48d8d8"/>
      <stop offset="70%" stop-color="#48d8d8"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Circuit nodes decorative -->
  <circle cx="120" cy="120" r="4" fill="#48d8d8" opacity="0.5"/>
  <circle cx="1080" cy="120" r="4" fill="#48d8d8" opacity="0.5"/>
  <circle cx="120" cy="510" r="4" fill="#48d8d8" opacity="0.5"/>
  <circle cx="1080" cy="510" r="4" fill="#48d8d8" opacity="0.5"/>
  <line x1="120" y1="120" x2="1080" y2="120" stroke="#48d8d8" stroke-width="0.8" opacity="0.15"/>
  <line x1="120" y1="510" x2="1080" y2="510" stroke="#48d8d8" stroke-width="0.8" opacity="0.15"/>

  <!-- Bitcoin symbol - large, left-center -->
  <text x="240" y="370" font-family="Arial Black, Arial, sans-serif" font-size="220" font-weight="900"
        fill="#48d8d8" opacity="0.08" text-anchor="middle">₿</text>

  <!-- Main ₿ symbol -->
  <text x="240" y="360" font-family="Arial Black, Arial, sans-serif" font-size="180" font-weight="900"
        fill="#48d8d8" opacity="0.9" text-anchor="middle" filter="url(#textGlow)">₿</text>

  <!-- Brand name -->
  <text x="680" y="270" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900"
        fill="#ffffff" text-anchor="middle" letter-spacing="-2">QuantumBTC</text>

  <!-- Tagline -->
  <text x="680" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="300"
        fill="#48d8d8" text-anchor="middle" letter-spacing="1" opacity="0.9">Securing Bitcoin Against the Quantum Threat</text>

  <!-- Separator line -->
  <line x1="420" y1="380" x2="940" y2="380" stroke="#48d8d8" stroke-width="1" opacity="0.3"/>

  <!-- Feature pills -->
  <rect x="430" y="400" width="160" height="34" rx="17" fill="#48d8d8" opacity="0.1" stroke="#48d8d8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="510" y="422" font-family="Arial, sans-serif" font-size="14" fill="#48d8d8" text-anchor="middle" opacity="0.9">Lightning Network</text>

  <rect x="605" y="400" width="140" height="34" rx="17" fill="#48d8d8" opacity="0.1" stroke="#48d8d8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="675" y="422" font-family="Arial, sans-serif" font-size="14" fill="#48d8d8" text-anchor="middle" opacity="0.9">Provably Fair</text>

  <rect x="760" y="400" width="160" height="34" rx="17" fill="#48d8d8" opacity="0.1" stroke="#48d8d8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="840" y="422" font-family="Arial, sans-serif" font-size="14" fill="#48d8d8" text-anchor="middle" opacity="0.9">Post-Quantum PQC</text>

  <!-- URL Footer -->
  <text x="600" y="560" font-family="Courier New, monospace" font-size="22" font-weight="400"
        fill="#ffffff" text-anchor="middle" opacity="0.4" letter-spacing="3">quantumbtc.dev</text>
</svg>
