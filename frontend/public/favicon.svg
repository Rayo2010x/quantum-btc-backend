<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <!-- Bitcoin B with quantum circuit aesthetic -->
  <g filter="url(#glow)">
    <!-- Circuit trace lines -->
    <line x1="14" y1="32" x2="22" y2="32" stroke="#48d8d8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="42" y1="32" x2="50" y2="32" stroke="#48d8d8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="32" y1="10" x2="32" y2="18" stroke="#48d8d8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="32" y1="46" x2="32" y2="54" stroke="#48d8d8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Corner nodes -->
    <circle cx="14" cy="32" r="2" fill="#48d8d8" opacity="0.7"/>
    <circle cx="50" cy="32" r="2" fill="#48d8d8" opacity="0.7"/>
    <circle cx="32" cy="10" r="2" fill="#48d8d8" opacity="0.7"/>
    <circle cx="32" cy="54" r="2" fill="#48d8d8" opacity="0.7"/>
    <!-- Bitcoin ₿ symbol -->
    <text
      x="32"
      y="42"
      font-family="Arial, sans-serif"
      font-size="28"
      font-weight="900"
      text-anchor="middle"
      fill="#48d8d8"
    >₿</text>
  </g>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>
